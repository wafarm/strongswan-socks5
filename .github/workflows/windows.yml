name: Build Windows (MSYS2)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Use the MSYS2 toolchain and matching MSYS libraries.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            autoconf
            automake
            base-devel
            bison
            flex
            gcc
            gmp-devel
            gperf
            libcurl-devel
            libtool
            openssl-devel
            pkgconf
            python

      - name: Configure Git line endings
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --enable-kernel-libipsec-socks-portable \
            --enable-static \
            --disable-shared \
            --disable-scripts \
            --disable-pki \
            --enable-monolithic \
            --enable-aes \
            --enable-curve25519 \
            --enable-gcm \
            --enable-hmac \
            --enable-md4 \
            --enable-md5 \
            --enable-sha1 \
            --enable-sha2 \
            --enable-gmp \
            --enable-eap-identity \
            --enable-eap-peap \
            --enable-des \
            --enable-eap-mschapv2 \
            --enable-dns-over-tls \
            --enable-curl

      - name: Build
        run: make --jobs="$(nproc)"

      - name: Collect executables
        run: |
          mkdir -p artifacts
          cp src/charon/charon.exe artifacts/charon.exe
          cp src/swanctl/swanctl.exe artifacts/swanctl.exe

      - name: Upload executables
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: strongswan-windows-msys2-${{ runner.arch }}
          path: |
            artifacts/charon.exe
            artifacts/swanctl.exe
          if-no-files-found: error
