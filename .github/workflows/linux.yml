name: Build Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            bison \
            build-essential \
            flex \
            gperf \
            libcurl4-openssl-dev \
            libgmp-dev \
            libtool \
            pkg-config

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --enable-kernel-libipsec-socks-portable \
            --enable-static \
            --disable-shared \
            --disable-scripts \
            --disable-pki \
            --enable-monolithic \
            --enable-aes \
            --enable-curve25519 \
            --enable-gcm \
            --enable-hmac \
            --enable-md4 \
            --enable-md5 \
            --enable-sha1 \
            --enable-sha2 \
            --enable-gmp \
            --enable-eap-identity \
            --enable-eap-peap \
            --enable-des \
            --enable-eap-mschapv2 \
            --enable-dns-over-tls \
            --enable-curl

      - name: Build
        run: make --jobs="$(nproc)"

      - name: Collect executables
        run: |
          mkdir -p artifacts
          cp src/charon/charon artifacts/charon
          cp src/swanctl/swanctl artifacts/swanctl

      - name: Upload executables
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: strongswan-linux-${{ runner.arch }}
          path: |
            artifacts/charon
            artifacts/swanctl
          if-no-files-found: error
