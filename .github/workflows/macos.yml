name: Build macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install autoconf automake bison curl flex gmp gperf libtool openssl@3 pkg-config
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          brew_prefix="$(brew --prefix)"
          openssl_prefix="$(brew --prefix openssl@3)"
          export CPPFLAGS="-I$openssl_prefix/include -I$brew_prefix/opt/curl/include -I$brew_prefix/opt/gmp/include"
          export LDFLAGS="-L$openssl_prefix/lib -L$brew_prefix/opt/curl/lib -L$brew_prefix/opt/gmp/lib"
          export PKG_CONFIG_PATH="$openssl_prefix/lib/pkgconfig:$brew_prefix/opt/curl/lib/pkgconfig:$brew_prefix/opt/gmp/lib/pkgconfig"
          ./autogen.sh
          ./configure --enable-kernel-libipsec-socks-portable \
            --enable-static \
            --disable-shared \
            --disable-scripts \
            --disable-pki \
            --enable-monolithic \
            --enable-aes \
            --enable-curve25519 \
            --enable-gcm \
            --enable-hmac \
            --enable-md4 \
            --enable-md5 \
            --enable-sha1 \
            --enable-sha2 \
            --enable-gmp \
            --enable-eap-identity \
            --enable-eap-peap \
            --enable-des \
            --enable-eap-mschapv2 \
            --enable-dns-over-tls \
            --enable-curl

      - name: Build
        run: make --jobs="$(sysctl -n hw.logicalcpu)"

      - name: Collect executables
        run: |
          mkdir -p artifacts
          cp src/charon/charon artifacts/charon
          cp src/swanctl/swanctl artifacts/swanctl

      - name: Upload executables
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: strongswan-macos-${{ runner.arch }}
          path: |
            artifacts/charon
            artifacts/swanctl
          if-no-files-found: error
